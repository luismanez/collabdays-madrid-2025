name: OurProducts
template: |
  Given the following list of facts extracted from our product catalog.
  {{memory.search query=$input limit='5'}}

  Help to answer the following question:
  Question: {{$input}}
  If the answer is empty say "I don't know".
template_format: semantic-kernel
description: A function that helps you answer a question related with our product catalog. Only run this plugin if you detect that the user is asking a question about our products.
input_variables:
  - name: input
    description: The question related to the product catalog.
    is_required: true
output_variable:
  description: The answer generated by the plugin.
execution_settings:
  default:
    temperature: 0.1